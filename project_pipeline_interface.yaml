pipeline_name: PEPPRO_collator
input_schema: peppro_input_schema.yaml
output_schema: peppro_output_schema.yaml
project_interface:
  command_template: >
    {looper.piface_dir}/pipelines/peppro_collator.py
    --config {looper.pep_config}
    -O {looper.output_dir}
    -P {compute.cores}
    -M {compute.mem}
    -n {project.name}
    -r {looper.results_subdir}
    --pipestat-config {pipestat.config_file}

compute:
  bulker_crate: databio/peppro:1.1.0
  size_dependent_variables: resources.tsv

bioconductor:
  readFunName: readPepproGeneCounts
  readFunPath: BiocProject/readPepproGeneCounts.R
