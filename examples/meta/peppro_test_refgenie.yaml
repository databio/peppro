# Run test sample through PEPPRO using Refgenie for genome assets
# Use with .looper.yaml configuration file
name: test

pep_version: 2.0.0
sample_table: peppro_test.csv

sample_modifiers:
  derive:
    attributes: [read1]
    sources:
        R1: "examples/data/{sample_name}_r1.fq.gz"
  imply:
    - if:
        organism: ["human", "Homo sapiens", "Human", "Homo_sapiens"]
      then:
        genome: hg38
        prealignment_names: ["human_rDNA"]
