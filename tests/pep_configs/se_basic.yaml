# SE PRO-seq, cutadapt + seqtk, no UMI — baseline single-end test
name: peppro_test_se_basic
pep_version: 2.0.0
sample_table: se_basic.csv

sample_modifiers:
  derive:
    attributes: [read1]
    sources:
      R1: "tests/data/test_R1.fastq.gz"
  imply:
    - if:
        organism: ["human"]
      then:
        genome: hg38
        prealignment_names: ["human_rDNA"]
        no_bw: "true"
