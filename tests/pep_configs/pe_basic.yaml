# PE PRO-seq, cutadapt + seqtk, no UMI — baseline paired-end test
name: peppro_test_pe_basic
pep_version: 2.0.0
sample_table: pe_basic.csv

sample_modifiers:
  derive:
    attributes: [read1, read2]
    sources:
      R1: "tests/data/test_R1.fastq.gz"
      R2: "tests/data/test_R2.fastq.gz"
  imply:
    - if:
        organism: ["human"]
      then:
        genome: hg38
        prealignment_names: ["human_rDNA"]
        no_bw: "true"
